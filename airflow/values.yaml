# https://artifacthub.io/packages/helm/airflow-helm/airflow
airflow:
  image:
    repository: apache/airflow
    tag: 2.2.5-python3.8

  connections:
    - id: airflow_logs
      type: wasb
      description: remote logging을 위한 blob storage connection 정보
      extra: |
        {
          "extra__wasb__connection_string": "STORAGE_ACCOUNT_CONNECTION_STRING"
        }

  config:
    ## security
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"

    ## domain used in airflow emails
    AIRFLOW__WEBSERVER__BASE_URL: "AIRFLOW_WEBSERVER_URL"

    ## dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    ## remote logging
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "wasb-airflow-logs"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "airflow_logs" # 고정

    # api auth
    AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth' # Google OAuth를 위해.

    # k8s
    AIRFLOW__KUBERNETES__DELETE_WORKER_PODS: "True"

    # enable external ingress
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"

    # timezone
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Asia/Seoul'

    PIP_TIMEOUT: 60
    PIP_INDEX_URL: "PYPI_URL"
    PIP_TRUSTED_HOST: "PYPI_HOST"

  variables:
    - key: NAME_SPACE
      value: 'airflow'
    - key: SENTRY_DSN
      value: 'SENTRY_DSN'

  users: []

  executor: KubernetesExecutor
  usersUpdate: true

  kubernetesPodTemplate:
    extraPipPackages:
      - "azure-storage-blob"
      - funcy==1.17
      - synology-api==0.4.4
      - python-i18n==0.3.9
      - azure-servicebus==7.8.2

    extraVolumeMounts:
      - name: airflow-pod-disk
        mountPath: /airflow-pod-disk
        readOnly: true

    extraVolumes:
      - name: airflow-pod-disk
        azureFile:
          secretName: airflow-pod-disk-secret
          shareName: airflow-pod-disk

serviceAccount:
  create: true

rbac:
  create: true

postgresql:
  enabled: true

  ## the postgres database to use
  ##
  postgresqlDatabase: airflow

  ## the postgres user to create
  ##
  postgresqlUsername: developer

  ## the postgres user's password
  ##
  ## WARNING:
  ## - you should NOT use this, instead specify `postgresql.existingSecret`
  ##
  postgresqlPassword: 9tf2oH

#  ## the name of a pre-created secret containing the postgres password
#  ##
#  existingSecret: ""
#
#  ## the key within `postgresql.existingSecret` containing the password string
#  ##
#  existingSecretKey: "postgresql-password"

  ## configs for the PVC of postgresql
  ##
  persistence:
    ## if postgres will use Persistent Volume Claims to store data
    ##
    ## WARNING:
    ## - if false, data will be LOST as postgres Pods restart
    ##
    enabled: true

    ## the name of the StorageClass used by the PVC
    ##
    storageClass: ""

    ## the access modes of the PVC
    ##
    accessModes:
      - ReadWriteOnce

    ## the size of PVC to request
    ##
    size: 8Gi

  ## configs for the postgres StatefulSet
  master:
    ## annotations for the postgres Pod
    ##
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

redis:
  enabled: false
#  enabled: true
#  existingSecret: airflow-redis

flower:
  enabled: false

elasticsearch:
  enabled: false

workers:
  enabled: false

web:
  extraPipPackages:
    - "azure-storage-blob"
    - "Flask-AppBuilder~=3.2.0" ## the following configs require Flask-AppBuilder 3.2.0 (or later)
    - "Authlib~=0.15.3" ## the following configs require Authlib

  webserverConfig:
    # 인증 정보
    stringOverride: |
      from airflow import configuration as conf
      from flask_appbuilder.security.manager import AUTH_OAUTH

      SQLALCHEMY_DATABASE_URI = conf.get('core', 'SQL_ALCHEMY_CONN')

      AUTH_TYPE = AUTH_OAUTH
      AUTH_ROLE_ADMIN = 'Admin'
      AUTH_ROLE_PUBLIC = 'Public'

      # registration configs
      AUTH_USER_REGISTRATION = True  # allow users who are not already in the FAB DB
      AUTH_USER_REGISTRATION_ROLE = "Viewer"  # this role will be given in addition to any AUTH_ROLES_MAPPING

      # the list of providers which the user can choose from
      OAUTH_PROVIDERS = [
          {'name':'google', 'icon':'fa-google',
              'token_key':'access_token',
              'remote_app': {
                  'client_id':'Google OAuth CLIENT_ID',
                  'client_secret':'Google OAuth Secret',
                  'api_base_url':'https://www.googleapis.com/oauth2/v2/',
                  'client_kwargs':{
                    'scope': 'openid profile email profile'
                  },
                  'request_token_url':None,
                  'access_token_url':'https://accounts.google.com/o/oauth2/token',
                  'authorize_url':'https://accounts.google.com/o/oauth2/auth'}
          }
      ]

      # a mapping from the values of `userinfo["role_keys"]` to a list of FAB roles
      AUTH_ROLES_MAPPING = {
          "FAB_USERS": ["User"],
          "FAB_ADMINS": ["Admin"],
      }

      # if we should replace ALL the user's roles each login, or only on registration
      AUTH_ROLES_SYNC_AT_LOGIN = False

      # force users to re-auth after 30min of inactivity (to keep roles in sync)
      PERMANENT_SESSION_LIFETIME = 1800

  extraVolumeMounts:
    - name: airflow-pod-disk
      mountPath: /airflow-pod-disk
      readOnly: true

  extraVolumes:
    - name: airflow-pod-disk
      azureFile:
        secretName: airflow-pod-disk-secret
        shareName: airflow-pod-disk

scheduler:
  extraPipPackages:
    - "azure-storage-blob"

dags:
  gitSync:
    enabled: true
    repo: "DAGS_GIT_REPO"
    branch: "main"
    revision: "HEAD"
    syncWait: 60
